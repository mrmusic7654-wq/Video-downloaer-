name: Build vidma APK

# Compiles the app on every push/PR and uploads installable APKs as
# workflow artifacts.
#
# Default output is lean: a single arm64-v8a release APK (and one debug
# APK for testing). The old pipeline built debug+release for 3 ABIs plus
# universal APKs — a large artifact per run. The bundled yt-dlp/Python
# runtime (and optional FFmpeg when requested) is triplicated per ABI, so a
# "fat" build (all ABIs + universal) stays available via workflow_dispatch only.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      allAbis:
        description: "Also build all ABIs + universal APK (large)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1 — make sure gradle-wrapper.jar is the official Gradle release
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

  # 2 — compile the lean APK set (arm64-v8a)
  build:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    env:
      GRADLE_ARGS: ${{ (github.event_name == 'workflow_dispatch' && inputs.allAbis)
        && '-Pvidma.abis=armeabi-v7a,arm64-v8a,x86_64 -Pvidma.universalApk=true'
        || '-Pvidma.abis=arm64-v8a' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the SDK command-line tools and accepts all licenses.
      # AGP then auto-downloads platforms;android-35 / build-tools during the
      # build because the licenses are already in place.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Our build.gradle.kts signs release builds automatically when
      # keystore.properties exists. On CI we generate a throwaway keystore so
      # the release APK is signed and directly installable on a device.
      - name: Create CI signing keystore
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v -keystore release.jks -alias vidma \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass vidma-ci -keypass vidma-ci \
              -dname "CN=vidma CI, O=vidma, C=US"
            printf 'storeFile=release.jks\nstorePassword=vidma-ci\nkeyAlias=vidma\nkeyPassword=vidma-ci\n' > keystore.properties
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease $GRADLE_ARGS --stacktrace

      - name: APK size report
        run: |
          echo "| APK | size |" && echo "|---|---|"
          find app/build/outputs/apk -name "*.apk" -printf "%p\t%s\n" \
            | awk -F'\t' 'function human(n) { split("B KB MB GB", U, " "); i=1; while (n >= 1024 && i < 4) { n/=1024; i++ } return sprintf("%.1f %s", n, U[i]) } { printf "| %s | %s |\n", $1, human($2) }'
          du -shc app/build/outputs/apk/*/*.apk | tail -1

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vidma-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
