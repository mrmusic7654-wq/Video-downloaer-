name: Build vidma APK

# Compiles the app on every push/PR and uploads installable
# debug + release APKs (per-ABI splits + universal) as workflow artifacts.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1 — make sure gradle-wrapper.jar is the official Gradle release
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

  # 2 — compile debug & release APKs
  build:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the SDK command-line tools and accepts all licenses.
      # AGP then auto-downloads platforms;android-35 / build-tools during the
      # build because the licenses are already in place.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Our build.gradle.kts signs release builds automatically when
      # keystore.properties exists. On CI we generate a throwaway keystore so
      # the release APK is signed and directly installable on a device.
      - name: Create CI signing keystore
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v -keystore release.jks -alias vidma \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass vidma-ci -keypass vidma-ci \
              -dname "CN=vidma CI, O=vidma, C=US"
            printf 'storeFile=release.jks\nstorePassword=vidma-ci\nkeyAlias=vidma\nkeyPassword=vidma-ci\n' > keystore.properties
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: List APK outputs
        run: |
          echo "debug:";   ls -la app/build/outputs/apk/debug || true
          echo "release:"; ls -la app/build/outputs/apk/release || true
          sha256sum app/build/outputs/apk/*/*.apk || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vidma-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
